name: Repository hygiene

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  hygiene:
    name: Compile and scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Compile backend sources
        run: python -m compileall -q backend

      - name: Check for generated bytecode
        shell: bash
        run: |
          if find . -type f \( -name '*.pyc' -o -name '*.pyo' \) -print -quit | grep -q .; then
            echo 'Generated Python bytecode must not be committed.'
            exit 1
          fi

      - name: Check for runtime uploads
        shell: bash
        run: |
          files=$(find uploads -type f -not -name '.gitkeep' -print)
          if [ -n "$files" ]; then
            echo 'Runtime contract uploads must not be committed:'
            printf '%s\n' "$files"
            exit 1
          fi

      - name: Check for obvious hardcoded credentials
        shell: bash
        run: |
          if grep -RInE '(sk-[A-Za-z0-9]{20,}|-----BEGIN (RSA|OPENSSH|EC|PRIVATE) KEY-----|^[[:space:]]*(AZURE_OPENAI_API_KEY|OPENAI_API_KEY|MONGODB_PASSWORD|SECRET_KEY|TOKEN)[[:space:]]*=[[:space:]]*[^[:space:]#]+)' \
            --exclude-dir='.git' --exclude='*.mp4' --exclude='*.pdf' .; then
            echo 'A hardcoded credential pattern was found.'
            exit 1
          fi
