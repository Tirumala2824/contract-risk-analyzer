<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analysis Status | Contract Risk Analyzer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="/css/styles.css" rel="stylesheet">
    <style>
        .status-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding-top: 80px;
        }

        .status-card {
            background: var(--color-bg-elevated);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-xl);
            padding: var(--space-10);
            text-align: center;
            box-shadow: var(--shadow-lg);
            max-width: 500px;
            width: 100%;
        }

        .spinner-ring {
            width: 120px;
            height: 120px;
            margin: 0 auto var(--space-8);
            position: relative;
        }

        .spinner-ring::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 50%;
            border: 4px solid var(--color-border);
        }

        .spinner-ring::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 50%;
            border: 4px solid transparent;
            border-top-color: var(--color-primary);
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .spinner-icon {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            color: var(--color-primary);
        }

        .agent-list {
            text-align: left;
            margin-top: var(--space-8);
        }

        .agent-item {
            display: flex;
            align-items: center;
            padding: var(--space-3) var(--space-4);
            border-radius: var(--radius-md);
            margin-bottom: var(--space-2);
            background: var(--color-bg-tertiary);
            transition: all var(--transition-base);
        }

        .agent-item.active {
            background: var(--color-primary-subtle);
            border-left: 3px solid var(--color-primary);
        }

        .agent-item.completed {
            background: var(--color-success-subtle);
            border-left: 3px solid var(--color-success);
        }

        .agent-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-right: var(--space-4);
            background: var(--color-text-muted);
            transition: all var(--transition-base);
        }

        .agent-item.active .agent-dot {
            background: var(--color-primary);
            animation: pulse 1.5s infinite;
        }

        .agent-item.completed .agent-dot {
            background: var(--color-success);
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }

            50% {
                opacity: 0.6;
                transform: scale(1.2);
            }
        }

        .agent-name {
            font-size: var(--font-size-sm);
            color: var(--color-text-secondary);
        }

        .agent-item.active .agent-name,
        .agent-item.completed .agent-name {
            font-weight: var(--font-weight-medium);
            color: var(--color-text-primary);
        }
    </style>
</head>

<body>
    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <a class="navbar-brand" href="/">
                <i class="bi bi-shield-check"></i>
                <span>Contract Risk Analyzer</span>
            </a>
        </div>
    </nav>

    <div class="status-page">
        <div class="status-card">
            <div class="spinner-ring">
                <div class="spinner-icon">
                    <i class="bi bi-cpu"></i>
                </div>
            </div>

            <h2 class="mb-3">Analyzing Contract</h2>
            <p class="text-muted mb-4" id="statusText">Initializing AI agents...</p>

            <div class="progress mb-4">
                <div class="progress-bar progress-bar-striped progress-bar-animated" id="statusProgress"
                    style="width: 10%"></div>
            </div>

            <div class="agent-list">
                <div class="agent-item" id="agent-legal">
                    <div class="agent-dot"></div>
                    <span class="agent-name">Legal & Contractual Risk</span>
                </div>
                <div class="agent-item" id="agent-compliance">
                    <div class="agent-dot"></div>
                    <span class="agent-name">Compliance & Regulatory Risk</span>
                </div>
                <div class="agent-item" id="agent-financial">
                    <div class="agent-dot"></div>
                    <span class="agent-name">Financial & Commercial Risk</span>
                </div>
                <div class="agent-item" id="agent-operational">
                    <div class="agent-dot"></div>
                    <span class="agent-name">Operational & Process Risk</span>
                </div>
                <div class="agent-item" id="agent-security">
                    <div class="agent-dot"></div>
                    <span class="agent-name">Security & Privacy Risk</span>
                </div>
                <div class="agent-item" id="agent-fraud">
                    <div class="agent-dot"></div>
                    <span class="agent-name">Fraud & Manipulation Risk</span>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="/js/app.js"></script>
    <script>
        // Animate agents during processing
        const agents = ['legal', 'compliance', 'financial', 'operational', 'security', 'fraud'];
        let currentAgent = 0;

        setInterval(() => {
            agents.forEach((agent, i) => {
                const el = document.getElementById('agent-' + agent);
                if (i < currentAgent) {
                    el.classList.remove('active');
                    el.classList.add('completed');
                } else if (i === currentAgent) {
                    el.classList.add('active');
                    el.classList.remove('completed');
                } else {
                    el.classList.remove('active', 'completed');
                }
            });
            currentAgent = (currentAgent + 1) % (agents.length + 1);
        }, 2000);
    </script>
</body>

</html>
